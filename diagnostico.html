<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#040a26">
<link rel="manifest" href="manifest.webmanifest">
<title>Diagnóstico — Diário de Classe</title>
<style>
  body{margin:0;background:#040a26;color:#eef3ff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  main{max-width:640px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{color:#9fb4e8;margin:0 0 18px}
  .item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;margin:8px 0;border:1px solid rgba(70,125,255,.35);border-radius:10px;background:rgba(10,24,72,.5)}
  .ok{color:#14e6a0}.erro{color:#ff6b8f}.aviso{color:#ffc234}
  .item b{display:block}.item small{color:#9fb4e8;display:block}
  #resumo{margin:18px 0;padding:14px;border-radius:12px;font-weight:700;border:1px solid}
  #resumo.ok{background:rgba(20,230,160,.1);border-color:#14e6a0}
  #resumo.erro{background:rgba(255,61,110,.1);border-color:#ff3d6e}
  a{color:#7fc8ff}
  button{font:inherit;color:#fff;background:#2f6bff;border:0;border-radius:10px;padding:12px 16px;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Diagnóstico do Diário de Classe</h1>
  <p class="sub">Esta página confere, sozinha, se o aplicativo está pronto para ser instalado. Aguarde alguns segundos.</p>
  <div id="lista"></div>
  <div id="resumo" class="erro">Verificando…</div>
  <button id="voltar" type="button">Abrir o aplicativo</button>
</main>
<script>
const lista = document.getElementById("lista"), problemas = [];
function linha(estado, titulo, detalhe) {
  const el = document.createElement("div"); el.className = "item";
  el.innerHTML = `<span class="${estado}">${estado === "ok" ? "✔" : estado === "aviso" ? "!" : "✘"}</span><div><b>${titulo}</b>${detalhe ? `<small>${detalhe}</small>` : ""}</div>`;
  lista.appendChild(el); if (estado === "erro") problemas.push(titulo + (detalhe ? " — " + detalhe : ""));
}
const carregaImagem = url => new Promise(res => { const i = new Image(); i.onload = () => res({ ok: true, w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res({ ok: false }); i.src = url + (url.includes("?") ? "&" : "?") + "d=" + Date.now(); });
let avisoInstalar = false;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); avisoInstalar = true; });

(async () => {
  const seguro = location.protocol === "https:" || location.hostname === "localhost";
  linha(seguro ? "ok" : "erro", "Endereço seguro (https)", seguro ? "" : "O endereço precisa começar com https://");

  /* versão do index.html publicada */
  try {
    const r = await fetch("index.html?d=" + Date.now(), { cache: "no-store" }); const t = await r.text();
    const v = (t.match(/name="app-versao" content="(\d+)"/) || [])[1];
    if (!r.ok) linha("erro", "Arquivo index.html", "não foi encontrado no site (erro " + r.status + ")");
    else if (!v) linha("erro", "Versão antiga do index.html no site", "O site ainda usa arquivos antigos. Envie de novo todos os arquivos do pacote mais recente.");
    else linha("ok", "Versão do aplicativo publicada: " + v, "");
    window.__usaPastas = /(icons|assets)\//.test(t);
    if (window.__usaPastas) linha("erro", "O index.html ainda aponta para as pastas assets/icons", "Substitua o index.html pelo do pacote mais recente (sem pastas).");
  } catch { linha("erro", "Não consegui ler o index.html", "Sem conexão ou arquivo ausente."); }

  /* manifesto */
  let manifesto = null;
  try {
    const r = await fetch("manifest.webmanifest?d=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    manifesto = await r.json(); linha("ok", "Arquivo manifest.webmanifest", "");
  } catch (e) { linha("erro", "Arquivo manifest.webmanifest", "não encontrado ou com erro (" + e.message + "). Envie esse arquivo ao repositório."); }

  /* ícones do manifesto */
  if (manifesto) {
    const icones = manifesto.icons || [];
    let tem192 = false, tem512 = false;
    for (const ic of icones) {
      const url = new URL(ic.src, location.href).href, esperado = parseInt(ic.sizes, 10);
      const r = await carregaImagem(url), nome = ic.src;
      if (!r.ok) linha("erro", "Ícone " + nome + " não abre", "O arquivo está ausente ou corrompido. Envie-o de novo (pelo site do GitHub: Add file → Upload files).");
      else if (r.w !== esperado || r.h !== esperado) linha("erro", "Ícone " + nome + " com tamanho errado", `tem ${r.w}×${r.h}, deveria ter ${esperado}×${esperado}.`);
      else { linha("ok", "Ícone " + nome + " (" + r.w + "×" + r.h + ")", ""); if (esperado === 192) tem192 = true; if (esperado === 512) tem512 = true; }
    }
    if (!tem192 || !tem512) linha("erro", "Faltam ícones de 192 e/ou 512 pixels válidos", "Sem eles o navegador não oferece instalar.");
    const st = await fetch(new URL(manifesto.start_url || "./", location.href).href, { cache: "no-store" }).then(r => r.status).catch(() => 0);
    linha(st === 200 ? "ok" : "erro", "Página inicial do app (start_url)", st === 200 ? "" : "erro " + st);
  }
  /* logos usados dentro do app */
  for (const f of ["logo-escola.png", "logo-parana.png"]) {
    const r = await carregaImagem(f); linha(r.ok ? "ok" : "erro", "Imagem " + f, r.ok ? "" : "não abre (ausente ou corrompida).");
  }

  /* service worker */
  if (!("serviceWorker" in navigator)) linha("erro", "Este navegador não suporta instalação de apps", "Use o Chrome ou o Edge (Android/PC) ou o Safari (iPhone).");
  else {
    let reg = await navigator.serviceWorker.getRegistration("./");
    if (!reg) { try { reg = await navigator.serviceWorker.register("sw.js"); } catch (e) { linha("erro", "Funcionamento sem internet (service worker)", e.message); } }
    if (reg) { await navigator.serviceWorker.ready.catch(() => {}); linha("ok", "Funcionamento sem internet (service worker)", ""); }
  }

  /* instalação */
  const jaInstalado = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  await new Promise(r => setTimeout(r, 2500));
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (jaInstalado) linha("ok", "O app já está instalado neste aparelho", "");
  else if (avisoInstalar) linha("ok", "O navegador liberou a instalação automática", "Ao abrir o app, aparece o convite “Instalar agora”.");
  else if (ios) linha("aviso", "iPhone: a instalação é manual", "Safari → Compartilhar → Adicionar à Tela de Início.");
  else linha(problemas.length ? "aviso" : "aviso", "O navegador ainda não liberou a instalação automática", problemas.length ? "Corrija os itens com ✘ acima e recarregue esta página." : "Se tudo acima está ✔, abra o app, navegue por alguns segundos e recarregue. Dentro de WhatsApp/Instagram não funciona: abra no Chrome.");

  const r = document.getElementById("resumo");
  if (problemas.length) { r.className = "erro"; r.innerHTML = "Há " + problemas.length + " problema(s) a corrigir. Veja os itens com ✘."; }
  else { r.className = "ok"; r.textContent = "Tudo certo com os arquivos do aplicativo."; }
})();
document.getElementById("voltar").onclick = () => location.href = "./";
</script>
</body>
</html>
